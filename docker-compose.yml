
services:
  web:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - static_volume:/home/app/staticfiles
    # НЕ монтируем папку static - файлы будут внутри контейнера
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn fish.wsgi:application --bind 0.0.0.0:8000"
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "nginx"
        env: "production"

    volumes:
      - ./nginx_simple.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/home/app/staticfiles:ro
      - ./logs/nginx:/var/log/nginx:rw  # Монтируем директорию логов

volumes:
  postgres_data:
  static_volume:
